[workspace]
resolver = "2"
members = ["crates/boot", "crates/arch", "crates/hal", "crates/kernel", "tools/xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
[workspace.dependencies]
bootloader = "=0.11.10"
bootloader_api = "=0.11.10"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Format, tests, clippy and boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-01-01
          components: rustfmt, clippy, rust-src, llvm-tools-preview
          targets: x86_64-unknown-none
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run host tests
        run: cargo xtask test
      - name: Check host crates
        run: cargo check -p nastalli-abi -p nastalli-arch -p nastalli-hal -p nastalli-kernel -p xtask
      - name: Run clippy
        run: cargo clippy -p nastalli-abi -p nastalli-arch -p nastalli-hal -p nastalli-kernel -p xtask -- -D warnings
      - name: Build kernel
        run: cargo xtask build
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-system-x86 ovmf
      - name: Smoke test kernel boot
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 10s env NASTALLI_QEMU_DISPLAY=none NASTALLI_QEMU_DEBUG=1 cargo xtask run 2>&1 | tee qemu.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ $status -ne 0 && $status -ne 124 ]]; then
            echo "QEMU smoke test exited unexpectedly with status $status"
            exit "$status"
          fi

          grep -F "NASTALLI OS v0.0.9" qemu.log
          grep -F "Scheduler initialized: round-robin, 5 tick quantum." qemu.log
          grep -F "Scheduler timer active: first PIT tick observed." qemu.log
          grep -F "Task switch: worker entered." qemu.log
          grep -F "Task switch: bootstrap resumed." qemu.log
          grep -F "Task switch: worker resumed." qemu.log
          grep -F "Task switch: bootstrap resumed twice." qemu.log
          grep -F "Ring 3 syscall entered kernel and returned." qemu.log
          grep -F "Ring 3 probe reached kernel breakpoint." qemu.log

          if grep -Fq "kernel panic:" qemu.log; then
            echo "Kernel panic detected during QEMU smoke test"
            exit 1
          fi
